data:
  root: /nfs/home/caracciolo/dataset/speedplus_yolo
  num_keypoints: 11
  image_size: 224
  bbox_pad_ratio: 0.1
  splits:
    train:
      images: images/train
      labels: labels/train
    val:
      images: images/val
      labels: labels/val
    lightbox:
      images: images/lightbox
      labels: labels/lightbox
    sunlamp:
      images: images/sunlamp
      labels: labels/sunlamp
  # Pose label JSON files (needed for keypoint_pnp mode)
  pose_labels:
    train: /nfs/home/caracciolo/dataset/speedplusv2/synthetic/train.json
    val: /nfs/home/caracciolo/dataset/speedplusv2/synthetic/validation.json
    lightbox: /nfs/home/caracciolo/dataset/speedplusv2/lightbox/test.json
    sunlamp: /nfs/home/caracciolo/dataset/speedplusv2/sunlamp/test.json

model:
  backbone: hrnet_w48           # informational label (not a HuggingFace ID)
  backbone_type: "hrnet"        # switch: "dinov3" | "hrnet"
  # Optional: path to mmpose HRNet-W48 COCO checkpoint for initialization.
  # Download from:
  #   https://download.openmmlab.com/mmpose/top_down/hrnet/hrnet_w48_coco_256x192-b9e0b3ab_20200708.pth
  # Set to null to use timm's default ImageNet pretrained weights instead.
  hrnet_pretrained: null
  freeze_backbone: true
  # For HRNet: number of final stages to unfreeze (HRNet has 4 stages total).
  # 4 = fully unfreeze all stages + stem (~28M params, much smaller than DINOv3 307M).
  unfreeze_last_n_blocks: 4
  head_hidden: [512, 256]       # used only for MLP head; ignored for heatmap head
  dropout: 0.1
  # Mode: "keypoint_only" | "keypoint_pnp"
  mode: "keypoint_only"
  # Keypoint head type: "heatmap" recommended for HRNet (simplified 1x1 conv head)
  keypoint_head_type: "heatmap"

# 3D model and camera (needed for keypoint_pnp mode)
geometry:
  points_3d: tango3Dpoints.json
  camera: camera.json
  pnp_iterations: 10

train:
  epochs: 50
  batch_size: 64
  lr: 1.0e-3
  lr_backbone: 1.0e-5
  weight_decay: 1.0e-4
  occluded_weight: 0.5
  num_workers: 2
  output_dir: ./outputs_hrnet_heatmap
  log_interval: 50

augmentation:
  # Photometric only — no spatial augmentations
  color_jitter: 0.5
  gaussian_blur_prob: 0.3
  gaussian_blur_kernel: [3, 7]
  gaussian_noise_prob: 0.3
  gaussian_noise_std: 0.02
  random_erasing_prob: 0.2
  # Space lighting augmentations
  sun_flare_prob: 0.3
  sun_flare_intensity: [0.3, 1.0]
  brightness_gradient_prob: 0.3
  brightness_gradient_strength: [0.2, 0.6]
  random_gamma_prob: 0.3
  random_gamma_range: [0.5, 2.0]
  # Sim-to-real domain gap augmentations
  motion_blur_prob: 0.2
  motion_blur_kernel: [5, 15]
  clahe_prob: 0.3
  clahe_clip_limit: [1.0, 4.0]
  channel_dropout_prob: 0.2
  # FDA disabled by default (can be enabled; same pipeline as DINOv3)
  fda_prob: 0.0
  fda_beta: 0.05
  fda_lambda: 0.5
  fda_target_domains:
    - lightbox
    - sunlamp

# FDA split configuration
fda:
  splits_dir: data/splits
  style_fraction: 0.2
  var_threshold: 0.003

# Loss weights
pose:
  lambda_keypoint: 1.0
  lambda_heatmap: 4.0
  # HRNet outputs at image_size/4 = 224/4 = 56 natively
  heatmap_size: 56
  # Slightly larger sigma for 56px heatmaps (vs 64px for DINOv3)
  heatmap_sigma: 2.0
  lambda_pnp_pose: 0.5
  rotation_weight: 1.0
  translation_weight: 1.0
  pnp_warmup_epochs: 0
  pnp_rampup_epochs: 0

eval:
  pck_threshold: 0.05
