# Self-Training with Pseudo-Labels configuration — FULL PASS (chunks 0-3, holdout preserved)
# style splits = chunks 0-3 only: ~4314 lightbox + ~1787 sunlamp = ~6101 images
# Chunk 4 is preserved as clean holdout (splits_holdout/) for evaluation.

self_training:
  # Pretrained checkpoint to generate initial pseudo-labels from
  pretrained_checkpoint: "outputs_self_training_incremental_cumulative_pass2/final_model.pth"

  # Confidence filtering: minimum heatmap peak to accept a pseudo-label
  # DINO model returns spatial-softmax heatmaps (sum=1 over 64x64=4096px),
  # so peak values are small. 0.02 corresponds to ~80x more peaked than uniform.
  confidence_threshold: 0.02

  # Loss weight for pseudo-labeled samples (vs 1.0 for GT-labeled)
  pseudo_label_weight: 0.5

  # Target domains to self-train on
  target_domains:
    - sunlamp
    - lightbox

  # Downsample synthetic training set per iteration (None = use all).
  # Re-sampled randomly each iteration for coverage diversity.
  # With ~6101 pseudo-labels, 16000 gives ~28% pseudo per epoch.
  synth_subset_size: 16000

  # Number of self-training rounds (re-generate pseudo-labels each round)
  num_iterations: 4

  # Epochs per self-training iteration
  epochs_per_iteration: 10

# Training hyperparams (lower LR for fine-tuning)
train:
  epochs: 10              # overridden by epochs_per_iteration
  batch_size: 8
  lr: 1.0e-4              # lower than initial training
  lr_backbone: 1.0e-6     # very conservative backbone updates
  weight_decay: 1.0e-4
  num_workers: 2
  output_dir: ./outputs_self_training_fullpass

# Splits directory — style files point to chunks 0-3 only (holdout excluded)
splits_dir: "data/splits_fullpass"

# Base config to inherit from
base_config: "config_keypoint.yaml"
