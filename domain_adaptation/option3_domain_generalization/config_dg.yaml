# Domain Generalization configuration (DSU + MixStyle)
# Trains ONLY on synthetic data — no target domain images needed

# Domain generalization modules
domain_generalization:
  enable_dsu: true
  enable_mixstyle: true
  # DSU: feature statistics perturbation
  dsu_alpha: 0.3          # mean perturbation strength
  dsu_beta: 0.3           # std perturbation strength
  # MixStyle: feature statistics mixing
  mixstyle_prob: 0.5      # probability of applying MixStyle per forward pass
  mixstyle_alpha: 0.1     # Beta distribution parameter
  # Which ViT blocks to apply to (0-indexed from end, e.g. last 4 of 24)
  apply_to_last_n_blocks: 4
  # Where to inject: "after_ln1" (after layernorm_before) or "after_ln2" (after layernorm_after)
  injection_point: "after_ln1"

# Override base config for DG training
train:
  epochs: 50
  batch_size: 64
  lr: 1.0e-3
  lr_backbone: 1.0e-5
  weight_decay: 1.0e-4
  num_workers: 2
  output_dir: ./outputs_domain_generalization

# Base config to inherit from
base_config: "config.yaml"
