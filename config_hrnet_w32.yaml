data:
  root: /nfs/home/caracciolo/dataset/speedplus_yolo
  num_keypoints: 11
  image_size: 512
  bbox_pad_ratio: 0.1
  imagenet_normalize: false
  splits:
    train:
      images: images/train
      labels: labels/train
    val:
      images: images/val
      labels: labels/val
    lightbox:
      images: images/lightbox
      labels: labels/lightbox
    sunlamp:
      images: images/sunlamp
      labels: labels/sunlamp
  # Pose label JSON files (needed for keypoint_pnp mode)
  pose_labels:
    train: /nfs/home/caracciolo/dataset/speedplusv2/synthetic/train.json
    val: /nfs/home/caracciolo/dataset/speedplusv2/synthetic/validation.json
    lightbox: /nfs/home/caracciolo/dataset/speedplusv2/lightbox/test.json
    sunlamp: /nfs/home/caracciolo/dataset/speedplusv2/sunlamp/test.json

model:
  backbone: hrnet_w32
  backbone_type: "hrnet_w32"
  hrnet_pretrained: null
  freeze_backbone: true
  unfreeze_last_n_blocks: 4
  head_hidden: [512, 256]
  dropout: 0.1
  mode: "keypoint_only"
  keypoint_head_type: "heatmap"

# 3D model and camera (needed for keypoint_pnp mode)
geometry:
  points_3d: tango3Dpoints.json
  camera: camera.json
  pnp_iterations: 10

train:
  epochs: 50
  batch_size: 8
  lr: 1.0e-3
  lr_backbone: 1.0e-5
  weight_decay: 1.0e-4
  occluded_weight: 0.5
  num_workers: 2
  output_dir: ./outputs_hrnet_w32_msssim
  log_interval: 50

augmentation:
  color_jitter: 0.5
  gaussian_blur_prob: 0.3
  gaussian_blur_kernel: [3, 7]
  gaussian_noise_prob: 0.3
  gaussian_noise_std: 0.02
  random_erasing_prob: 0.2
  sun_flare_prob: 0.3
  sun_flare_intensity: [0.3, 1.0]
  brightness_gradient_prob: 0.3
  brightness_gradient_strength: [0.2, 0.6]
  random_gamma_prob: 0.3
  random_gamma_range: [0.5, 2.0]
  motion_blur_prob: 0.2
  motion_blur_kernel: [5, 15]
  clahe_prob: 0.3
  clahe_clip_limit: [1.0, 4.0]
  channel_dropout_prob: 0.2
  fda_prob: 0.0
  fda_beta: 0.05
  fda_lambda: 0.5
  fda_target_domains:
    - lightbox
    - sunlamp

# FDA split configuration
fda:
  splits_dir: data/splits
  style_fraction: 0.2
  var_threshold: 0.003

# Loss weights
pose:
  lambda_keypoint: 1.0
  lambda_heatmap: 4.0
  heatmap_size: 128
  heatmap_sigma: 2.0
  lambda_pnp_pose: 0.5
  rotation_weight: 1.0
  translation_weight: 1.0
  # MS-SSIM heatmap loss (structural similarity for Gaussian peak supervision)
  lambda_msssim: 1.0
  msssim_warmup_epochs: 5
  msssim_rampup_epochs: 10
  msssim_win_size: 7
  msssim_num_scales: 4
  pnp_warmup_epochs: 0
  pnp_rampup_epochs: 0

eval:
  pck_threshold: 0.05
